<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Page Title</title>
    <script>
        function createListofvalue() {
            var n=myform.n.value
            mydiv.innerHTML=""
            for(var i=1;i<=n;i++) {
                style="color: red";
                if (i % 2 == 0) {
                    style="color: blue";
                }
                line="<p style='" + style + "'>" + i + "</p>"
                mydiv.innerHTML+=line
            }
        }
    </script>
</head>
<body>
    <form name="myform">
            <p> Input N [1 - 100]: 
            <input type="number" name="n" min="1" max="100">
            </p>
            <button type="button" onclick="createListofvalue()">Create List</button>
    </form>
    <div id="mydiv">

    </div>
</body>
</html>
