<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Page Title</title>
</head>
<body>
    <form name="myform">
        <h3> Select language:</h3>
        <input type="radio" name="language" value="vi" id="rad1" checked 
        onclick="
        id_div_vi.style.display = 'block';
        id_div_kor.style.display = 'none';
        id_div_chinese.style.display = 'none';"> 
        <label for="rad1"> Vietnamese</label><br>
        <input type="radio" name="language" value="korea" id="rad3" 
        onclick="
        id_div_vi.style.display = 'none';
        id_div_kor.style.display = 'block';
        id_div_chinese.style.display = 'none';">
        <label for="rad3">Hanguk</label><br>
        <input type="radio" name="language" value="chinese" id="rad4" 
        onclick="
        id_div_vi.style.display = 'none';
        id_div_kor.style.display = 'none';
        id_div_chinese.style.display = 'block';">
        <label for="rad4">China</label><br>
        <div id="id_div_vi">
            <h4> Xin chào</h4>
        </div>
        <div id="id_div_kor">
            <h4> Bangchin Saranghae</h4>
        </div>
        <div id="id_div_chinese">
            <h4> Xiexie</h4>
        </div>
    </form>
</body>
</html>
