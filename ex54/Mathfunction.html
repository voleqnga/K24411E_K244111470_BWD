<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ex54</title>
    <script type="text/javascript">
        function findMax(a, b, c) {
            a = Number(a);
            b = Number(b);  
            c = Number(c);
            var arr = [a, b, c];
            var max = arr[0];
            for (var i = 1; i < arr.length; i++) {
                if (arr[i] > max) {
                    max = arr[i]; 
                }
            }
            document.myForm.input_result.value = max;
        }
        function findMin(a, b, c) {
            a = Number(a);
            b = Number(b);
            c = Number(c);
            var arr = [a, b, c];
            var min = arr[0];
            for (var i = 1; i < arr.length; i++) {
                if (arr[i] < min) {
                    min = arr[i]; 
                }
            }
            document.myForm.input_result.value = min;
        }
        function calculateSin(a) {
            a = Number(a);
            var radian = a * Math.PI / 180;
            var kq = Math.sin(radian);
            document.myForm.input_result.value = kq;
        }
        function calculateCos(a) {
            a = Number(a);
            var radian = a * Math.PI / 180;
            var kq = Math.cos(radian);
            document.myForm.input_result.value = kq;
        }
        function calculatePower(a, b) {
            a = Number(a);
            b = Number(b);
            var kq = Math.pow(a, b);
            document.myForm.input_result.value = kq;
        }
    </script>
</head>
<body>
    <form name="myForm">
        <h3>Math function</h3>
        <table border="1">
            <tr>
                <td>a:</td>
                <td>
                    <input type="text" name="input_a">
                </td>
            </tr>
            <tr>
                <td>b:</td>
                <td>
                    <input type="text" name="input_b">
                </td>
            </tr>
            <tr>
                <td>c:</td>
                <td>
                    <input type="text" name="input_c">
                </td>
            </tr>
            <tr>
                <td>Result:</td>
                <td>
                    <input type="text" name="input_result" readonly>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="button" value="MAX" onclick="findMax(myForm.input_a.value, myForm.input_b.value, myForm.input_c.value)">
                    <input type="button" value="MIN" onclick="findMin(myForm.input_a.value, myForm.input_b.value, myForm.input_c.value)">
                    <input type="button" value="sin(a)" onclick="calculateSin(myForm.input_a.value)">
                    <input type="button" value="Cos(a)" onclick="calculateCos(myForm.input_a.value)">
                    <input type="button" value="a^b" onclick="calculatePower(myForm.input_a.value, myForm.input_b.value)">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
