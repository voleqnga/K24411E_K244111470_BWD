<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Page Title</title>
    <link rel="stylesheet" href="css/maincss.css">
    <script>
        function process_saveproduct()
        {
            productID=document.getElementById("productid").value;
            productName=document.getElementById("productname").value;
            //get productbody
            productbody=document.getElementById("productbody");
            //create tr element
            tr=document.createElement("tr");
            //create 2 td
            td_id=document.createElement("td");
            td_name=document.createElement("td");
            //assign value for td 
            td_id.innerHTML=productID
            td_name.innerHTML=productName
            //append td into tr
            tr.appendChild(td_id);
            tr.appendChild(td_name);
            //append tr into productbody
            productbody.appendChild(tr);
        }
    </script>
    <script src="js/dataset.js"></script>
    <script src="js/mainjs.js"></script>
</head>
<body>
    <form name="myform">
        <table>
            <tr>
                <td> Product ID:</td>
                <td>
                    <input type="text" name="productid" id="productid">
                </td>
            </tr>
            <tr>
                <td>Product Name</td>
                <td>
                    <input type="text" name="productname" id="productname">
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <button type="button" onclick="process_saveproduct()"> Save Product</button>
                </td>
            </tr>
        </table>
    </form>
    <table border="1">
        <thead>
            <tr>
                <th> Product ID</th>
                <th> Product Name</th>
            </tr>
        </thead>
        <tbody id="productbody">

        </tbody>
    </table>
    <script>
        productbody=document.getElementById("productbody");
        load_products(products, productbody);
    </script>
</body>
</html>
