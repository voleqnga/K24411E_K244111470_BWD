<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Page Title</title>
</head>
<body>
    <div style="text-align: center;">
        <img src="Jackson.gif">
    </div>
    <h1 style="text-align: center;"> Register Form </h1>
    <form
            action="process_register.html"
            method="post"
            name="register">
        <table border="0" width="100%" cellspacing="0" cellpadding="5">
            <caption> 
                Register your Jackson Electronics product here
            </caption>
            <tr>
                <td>
                    First Name:
                </td>
                <td colspan="2">
                    <input type="text" name="firstname" id="firstname" value="firstname" required>
                </td>
                <td>
                    Last Name:
                </td>
                <td colspan="2">
                    <input type="text" name="lastname" id="lastname" value="lastname" required>
                </td>
            </tr>
            <tr>
                <td>
                    Address #1:
                </td>
                <td colspan="2">
                    <input type="text" name="address1" id="address1" value="address1" required style="width: 100%;">
                </td>   
            </tr>
            <tr>
                <td>
                    Address #2:
                </td>
                <td colspan="2">
                    <input type="text" name="address2" id="address2" value="address2" required style="width: 100%;">
                </td>   
            </tr>
            <tr>
                <td>
                    City:
                </td>
                <td>
                    <input type="text" name="city" id="city" value="city" required>
                </td>
                <td>
                    State:
                </td>
                <td>
                    <input type="text" name="state" id="state" value="state" required>
                </td>
                <td>
                    Zip:
                </td>   
                <td>
                    <input type="text" name="zip" id="zip" value="zip" required>
                </td> 
            </tr>
            <tr>
                <td>
                    Country:
                </td>
                <td colspan="2">
                    <input type="text" name="country" id="country" value="country" required>
                </td>
            </tr>
            
            <tr>
                <td> 
                    Product
                </td>
                <td>
                    <form name="product">
                        <select name="products" id="products" onchange="product.selectedproduct.value=this.value;
                        product.selectedproductname.value=this.options[this.selectedIndex].text;">
                            <option value="hanoi">Hanoi</option>
                            <option value="hcm">Ho Chi Minh City</option>
                            <option value="danang">Da Nang</option>
                            <option value="hue">Hue</option>
                            <option value="hue">Hue</option>
                        </select>
                        <p> Value of selected province:</p>    
                        <input type="text" id="selectedproduct" readonly>
                        <p> Name of selected Province</p>
                        <input type="text" id="selectedproductname" readonly>
                    </form>
                </td>
            </tr>

        </table>
    </form>
</body>
</html>
