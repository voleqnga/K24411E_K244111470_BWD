<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Ex52</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 10px;
            vertical-align: top;
        }
        label {
            font-weight: bold;
        }
        .half {
        width: 50%;
        }
        input[type="text"], input[type="email"], textarea, select {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: red;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <h2> Contact the editorial office</h2>
    <form 
    action="Transfer.html"
    method="get"
    name="contactform">
        <table>
            <tr>
                <td colspan="2">
                    <label for="fullname">
                        Full name
                    </label>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                     <input type="text" name="fullname" id="fullname" required >
                </td>
            </tr>
            <tr>
                <td class="half">
                    <label for="email">
                        Email
                    </label>
                </td>
                <td class="half">
                    <label for="sendto">
                        Send to
                    </label>
                </td>
            </tr>
            <tr>
                <td class="half">
                    <input type="email" name="email" id="email" required>
                </td>
                <td class="half">
                    <select name="sendto" id="sendto">
                        <option value="Editorial Board">Editorial Board</option>
                        <option value="News Department">News Department</option>
                        <option value="Board of Perspectives">Board of Perspectives</option>
                        <option value="World Board">World Board</option>
                        <option value="Business Department">Business Department</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <label for="title">
                        Title
                    </label>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="text" name="title" id="title" required>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <label for="content">
                        Content
                    </label>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <textarea name="content" id="content" rows="10" cols="50" required></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="submit">Send</button>
                </td>
            </tr>
        </table>
    </form>

                
</body>
</html>
