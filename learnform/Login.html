<html>
    <head>
        <title>Login</title>
    </head>
    <body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f0f2f5;">
        <div style="text-align: center; font-size: 30px; font-weight: bold; background: #fff; padding: 20px; width: fit-content; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25); border-radius: 12px;">
            Login Form  
        <form
            action="process_login.html"
            method="get"
            name="loginform">
            <table border="0" width="100%" cellspacing="0" cellpadding="5">
                <tr>
                    <td rowspan="7">
                        <img src="tải xuống.jpg"
                        alt="Admin Image">
                    </td>
                </tr>
                <tr>
                    <td style ="text-align: center; font-size: 20px; font-weight: bold;">
                        Login 
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="username">
                        User Name
                        </label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="text" name="username" id="username" value="obama" required>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="password">
                        Password
                        </label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="password" name="password" id="password" value="123456" required>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="checkbox" name="remember" value="yes" id="remember">
                        <label for="remember">
                            Remember me
                        </label>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <input type="submit" value="Login">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
        </form>
        </div>
    </body>
</html>
