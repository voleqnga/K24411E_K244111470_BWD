<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Quiz Form</title>
</head>
<body>
    <fieldset>
        <legend>Quiz Form</legend>
        <form action="process_quizz.html" method="post">
            <table>
                <tr>
                    <td>Question 1: What is the capital of France?</td>
                </tr>
                <tr>
                    <td>
                        <input type="radio" name="q1" value="a" id="q1a"> <label for="q1a">a) Berlin</label><br>
                        <input type="radio" name="q1" value="b" id="q1b"> <label for="q1b">b) Madrid</label><br>
                        <input type="radio" name="q1" value="c" id="q1c"> <label for="q1c">c) Paris</label><br>
                        <input type="radio" name="q1" value="d" id="q1d"> <label for="q1d">d) Rome</label><br>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button type="submit">Submit</button>
                    </td>
                </tr>
            </table>
        </form>
    </fieldset>
</body>
</html>
