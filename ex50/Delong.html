<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ex50</title>
    <style>
        body {
            background-color: #ccffff; 
            font-family: "Times New Roman", Times, serif;
            margin: 20px auto;
            padding: 20px;
            max-width: 800px;
        }
        h1 { 
            margin-bottom: 5px; 
            text-align: center;
        }
        hr { 
            border: 0; border-top: 1px solid #333; 
            margin-bottom: 20px; 
        }

        .layout-table {
            width: 100%;
            border: none;
        }
        .layout-table td {
            padding-bottom: 15px; 
        }

        .expense-table {
            border-collapse: collapse;
            width: 100%;
            max-width: 700px;
            margin-top: 5px;
        }
        .expense-table th, .expense-table td {
            border: 1px solid #008080; 
            padding: 5px;
            text-align: center;
        }
        .expense-table th { 
            background-color: #b3ffff; 
            font-weight: bold; 
        }
        
        .short-input { width: 120px; }
        textarea { 
            width: 500px; 
            height: 80px; 
            resize: none;
        }
        .table-input { 
            width: 90%; 
            box-sizing: border-box; 
        }
        .footer { 
            font-size: 0.9em; 
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div>
        <img src="DeLong.jpg" style="width:80%;display:block;margin:auto">
    </div>
    <h1>Travel Expense Report</h1>
    <hr>
    <form id="expenseForm">
        <table class="layout-table">
            <tr>
                <td>
                    1) First Name: 
                    <input type="text" class="short-input"> 
                </td>
                <td>
                    Last Name: 
                    <input type="text" class="short-input">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    2) Social Security Number: 
                    <input type="text" class="short-input">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    3) Department: 
                    <select>
                        <option value="Accounting">Accounting</option>
                        <option value="HR">Human Resources</option>
                        <option value="IT">IT</option>
                        <option value="Sales">Sales</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    4) Describe the purpose of your trip.
                    <br>
                    <textarea></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    5) Itemize your travel expenses
                    
                    <table class="expense-table">
                        <thead>
                            <tr>
                                <th style="width: 15%;">Date</th>
                                <th style="width: 45%;">Description</th>
                                <th style="width: 25%;">Category</th>
                                <th style="width: 15%;">Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <input type="text" class="table-input" placeholder="mm/dd/yy">
                                </td>
                                <td>
                                    <input type="text" class="table-input">
                                </td>
                                <td>
                                    <select class="table-input">
                                        <option>Meal</option>
                                        <option>Flight</option>
                                        <option>Hotel</option>
                                    </select>
                                </td>
                                <td>
                                    <input type="text" class="table-input">
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <input type="text" class="table-input" placeholder="mm/dd/yy">
                                </td>
                                <td>
                                    <input type="text" class="table-input">
                                </td>
                                <td>
                                    <select class="table-input">
                                        <option>Meal</option>
                                        <option>Flight</option>
                                        <option>Hotel</option>
                                    </select>
                                </td>
                                <td>
                                    <input type="text" class="table-input">
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <input type="text" class="table-input" placeholder="mm/dd/yy">
                                </td>
                                <td>
                                    <input type="text" class="table-input">
                                </td>
                                <td>
                                    <select class="table-input">
                                        <option>Meal</option>
                                        <option>Flight</option>
                                        <option>Hotel</option>
                                    </select>
                                </td>
                                <td><input type="text" class="table-input"></td>
                            </tr>
                            <tr>
                                <td><input type="text" class="table-input" placeholder="mm/dd/yy"></td>
                                <td><input type="text" class="table-input"></td>
                                <td>
                                    <select class="table-input">
                                        <option>Meal</option>
                                        <option>Flight</option>
                                        <option>Hotel</option>
                                    </select>
                                </td>
                                <td>
                                    <input type="text" class="table-input">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    6) Have you submitted your receipts? 
                    <input type="radio" name="receipt" value="Yes" id="rec-yes"><label for="rec-yes">Yes</label> 
                    <input type="radio" name="receipt" value="No" id="rec-no"><label for="rec-no">No</label>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="button" onclick="alert('Alert for submit')">Submit travel expenses</button>
                    <button type="reset">Reset</button>
                </td>
            </tr>
        </table>
    </form>

    <div class="footer">
        Questions? Contact Debbie Larson in Accounting (ext. 2150).
    </div>
</body>
</html>
