<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Page Title</title>
    <script src="js/mainjs.js"></script>
    <script type="text/javascript">
        function xuly(a, b, pt) {
            {
                kq=thuchienpheptoan(eval(a), eval(b), pt)
                document.getElementById("ketqua").innerText=kq
            }
        }
    </script>
</head>
<body>
    <form>
    <table>
        <tr>
            <td> Hệ số a </td>
            <td><input type="text" id="hsa"></td>
        </tr>
        <tr>
            <td> Hệ số b </td>
            <td><input type="text" id="hsb"></td>
        </tr>
        <tr>
            <td> Kết quả </td>
            <td id="ketqua"> </td>
        </tr>
        <tr>    
            <td colspan="2">
                <input type="button" value="Cộng" onclick="xuly(hsa.value, hsb.value, 'cong')">
                <input type="button" value="Trừ" onclick="xuly(hsa.value, hsb.value, 'tru')">
                <input type="button" value="Nhân" onclick="xuly(hsa.value, hsb.value, 'nhan')">
                <input type="button" value="Chia" onclick="xuly(hsa.value, hsb.value, 'chia')">
            </td>
        </tr>
    </table>
    </form>
</body>
</html>
